<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Photoshop Drag and Drop Fix — Windows 3-Step Diagnostic Skill">
  <title>Photoshop Drag and Drop Fix</title>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="100%" stop-color="#1979ff"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001a4d"/>
      <stop offset="100%" stop-color="#31a8ff"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="800" height="240" fill="url(#bgGrad)" rx="14"/>

  <!-- Subtle grid overlay -->
  <g opacity="0.08" fill="none" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="400" y1="0" x2="400" y2="240"/>
    <line x1="500" y1="0" x2="500" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="700" y1="0" x2="700" y2="240"/>
  </g>

  <!-- LEFT VISUAL: File icon (the thing being dragged) -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="50" height="60" fill="#ffffff" rx="4"/>
    <path d="M 32 0 L 50 18 L 32 18 Z" fill="#a0c4ff"/>
    <line x1="8" y1="32" x2="42" y2="32" stroke="#1979ff" stroke-width="2"/>
    <line x1="8" y1="42" x2="42" y2="42" stroke="#1979ff" stroke-width="2"/>
    <line x1="8" y1="52" x2="30" y2="52" stroke="#1979ff" stroke-width="2"/>
  </g>

  <!-- Arrow from file to monitor -->
  <g transform="translate(125, 120)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#ffffff" stroke-width="3" stroke-dasharray="5 5"/>
    <polygon points="50,0 42,-6 42,6" fill="#ffffff"/>
  </g>

  <!-- Monitor showing PS with green success checkmark -->
  <g transform="translate(195, 55)">
    <rect x="0" y="0" width="140" height="100" fill="#001a4d" stroke="#31a8ff" stroke-width="3" rx="8"/>
    <text x="70" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#31a8ff">Ps</text>
    <!-- Stand -->
    <rect x="55" y="100" width="30" height="8" fill="#31a8ff" rx="2"/>
    <rect x="40" y="108" width="60" height="5" fill="#31a8ff" rx="2"/>
    <!-- Green success badge (top-right of monitor) -->
    <circle cx="125" cy="15" r="14" fill="#10b981"/>
    <path d="M 119 16 L 124 21 L 132 11" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RIGHT: Title block -->
  <g transform="translate(380, 60)">
    <!-- Platform ribbon -->
    <rect x="0" y="0" width="86" height="22" fill="url(#ribbonGrad)" rx="4"/>
    <text x="43" y="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">WINDOWS</text>

    <!-- Main title (two lines) -->
    <text x="0" y="60" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Photoshop</text>
    <text x="0" y="94" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Drag &amp; Drop Fix</text>

    <!-- Tagline -->
    <text x="0" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#a0c4ff">3-Step Decision Tree · Diagnose-Only</text>

    <!-- Meta line -->
    <text x="0" y="150" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#8aa9d6">MIT License · v1.0 · Adobe Photoshop 2026 (27.x)</text>
  </g>

  <!-- BOTTOM-RIGHT: 3-step indicator dots -->
  <g transform="translate(670, 200)">
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <circle cx="18" cy="0" r="5" fill="#10b981"/>
    <circle cx="36" cy="0" r="5" fill="#10b981"/>
    <text x="48" y="4" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#a0c4ff">3 steps</text>
  </g>
</svg>